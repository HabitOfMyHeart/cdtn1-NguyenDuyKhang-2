<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Smart CRM – Mekong Mobile: module tiếp nhận và phân loại yêu cầu bảo hành, Luồng L2."
    />
    <title>Smart CRM – Mekong Mobile | Luồng L2</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #172033;
        --muted: #667085;
        --line: #e3e9f2;
        --primary: #1d4ed8;
        --primary-dark: #173ea8;
        --primary-soft: #e8efff;
        --danger: #b42318;
        --danger-soft: #fee4e2;
        --warn: #b54708;
        --warn-soft: #fef0c7;
        --ok: #067647;
        --ok-soft: #dcfae6;
        --shadow: 0 12px 35px rgba(20, 40, 80, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(circle at 8% 0%, #e6efff 0, transparent 28rem),
          radial-gradient(circle at 95% 10%, #e9fbf4 0, transparent 24rem),
          var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 24px 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.87);
        border: 1px solid rgba(227, 233, 242, 0.9);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: linear-gradient(135deg, #1d4ed8, #0e7490);
        color: #fff;
        font-weight: 800;
        letter-spacing: -0.5px;
        box-shadow: 0 8px 18px rgba(29, 78, 216, 0.28);
        flex: none;
      }

      .brand-title {
        margin: 0;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.2px;
      }

      .brand-subtitle {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .user-area {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .user-chip {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 12px 7px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
      }

      .user-name {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
      }

      .user-role {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.2;
      }

      .nav-tabs {
        display: flex;
        gap: 8px;
        margin: 20px 0 22px;
        flex-wrap: wrap;
      }

      .nav-tab {
        border: 1px solid var(--line);
        background: #fff;
        color: #344054;
        border-radius: 11px;
        padding: 10px 16px;
        font-weight: 650;
        font-size: 13.5px;
        transition: 0.16s ease;
      }

      .nav-tab:hover {
        border-color: #c7d7fe;
        color: var(--primary);
        transform: translateY(-1px);
      }

      .nav-tab.active {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
        box-shadow: 0 7px 16px rgba(29, 78, 216, 0.24);
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .page-title {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 30px);
        letter-spacing: -0.65px;
        line-height: 1.2;
      }

      .page-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 760px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: #fff;
        color: #344054;
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 13.5px;
        font-weight: 650;
        transition: 0.16s ease;
        white-space: nowrap;
      }

      .btn:hover {
        border-color: #b8c7e8;
        background: #f8faff;
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .btn.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--primary-dark);
      }

      .btn.ghost {
        background: transparent;
      }

      .btn.danger {
        border-color: #f3b6b1;
        background: #fff7f6;
        color: var(--danger);
      }

      .btn.small {
        padding: 7px 11px;
        font-size: 12.5px;
        border-radius: 9px;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .pad {
        padding: 20px;
      }

      .sla-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding: 14px 18px;
        border: 1px solid #c7d7fe;
        border-radius: 14px;
        background: linear-gradient(100deg, #eef4ff, #f8fbff);
        color: #1e3a8a;
        font-size: 13.5px;
      }

      .sla-targets {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .sla-chip {
        padding: 5px 10px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #c7d7fe;
        font-size: 12px;
        font-weight: 700;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }

      .metric-card {
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }

      .metric-card.alert {
        border-color: #f3b6b1;
        background: #fffafa;
      }

      .metric-card.warn {
        border-color: #f5d38b;
        background: #fffdf5;
      }

      .metric-value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.7px;
        line-height: 1.1;
      }

      .metric-label {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 650;
      }

      .metric-note {
        margin-top: 5px;
        color: #98a2b3;
        font-size: 11.5px;
      }

      .filters {
        display: grid;
        grid-template-columns: minmax(200px, 1.4fr) repeat(3, minmax(140px, 0.7fr)) auto;
        gap: 10px;
        align-items: end;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .field > span,
      .field-label {
        color: #475467;
        font-size: 12.5px;
        font-weight: 700;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 9px 11px;
        outline: none;
        transition: 0.16s ease;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: #84adff;
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      }

      .input.invalid,
      .select.invalid,
      .textarea.invalid {
        border-color: #f04438;
        background: #fffbfa;
      }

      .textarea {
        min-height: 92px;
        resize: vertical;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      .field-error {
        color: var(--danger);
        font-size: 12px;
        font-weight: 600;
      }

      .inline-alert {
        border: 1px solid #f5d38b;
        background: #fffcf3;
        color: #7a4a06;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
      }

      .inline-alert.error {
        border-color: #f3b6b1;
        background: #fff6f5;
        color: var(--danger);
      }

      .table-wrap {
        overflow: auto;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1040px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f8fafc;
        color: #475467;
        font-size: 11.5px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        text-align: left;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      td {
        padding: 13px;
        border-bottom: 1px solid #eef2f7;
        vertical-align: middle;
        font-size: 13px;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tr.clickable {
        cursor: pointer;
        transition: 0.13s ease;
      }

      tr.clickable:hover {
        background: #f7faff;
      }

      tr.row-overdue {
        background: #fff8f7;
      }

      tr.row-overdue:hover {
        background: #fff1ef;
      }

      tr.row-soon {
        background: #fffdf6;
      }

      tr.row-soon:hover {
        background: #fff9e8;
      }

      .cell-strong {
        font-weight: 700;
      }

      .cell-sub {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11.5px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 750;
        white-space: nowrap;
      }

      .pill.blue {
        background: #e8efff;
        color: #1d4ed8;
      }

      .pill.green {
        background: var(--ok-soft);
        color: var(--ok);
      }

      .pill.amber {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .pill.red {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .pill.gray {
        background: #eef2f6;
        color: #475467;
      }

      .pill.violet {
        background: #f3e8ff;
        color: #7e22ce;
      }

      .data-state {
        padding: 30px 22px;
        border: 1px dashed #cbd5e1;
        border-radius: 14px;
        background: #fff;
      }

      .skeleton {
        display: grid;
        gap: 10px;
      }

      .skeleton-row {
        height: 42px;
        border-radius: 9px;
        background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%);
        background-size: 400% 100%;
        animation: shimmer 1.3s ease infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      .state-title {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.2px;
      }

      .state-text {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }

      .empty-state,
      .error-state {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .state-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 21px;
        flex: none;
      }

      .state-icon.error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .state-actions {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .error-sections {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .error-section {
        border: 1px solid #f3d0cc;
        background: #fffafa;
        border-radius: 11px;
        padding: 10px 12px;
      }

      .error-section b {
        display: block;
        color: #912018;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 3px;
      }

      .error-section span {
        color: #5f2a25;
        font-size: 12.5px;
      }

      .retrieval-code {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #2f1b1a;
        color: #ffe4e1;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
      }

      .demo-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px dashed #b8c7e8;
        border-radius: 12px;
        background: #f8fbff;
      }

      .demo-toolbar .label {
        color: #475467;
        font-size: 12px;
        font-weight: 750;
        margin-right: 2px;
      }

      .intake-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(330px, 0.92fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcfe;
      }

      .step-badge {
        display: grid;
        place-items: center;
        width: 27px;
        height: 27px;
        border-radius: 8px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        flex: none;
      }

      .panel-title {
        margin: 0;
        font-size: 14.5px;
        font-weight: 800;
      }

      .panel-body {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .form-grid .span-2 {
        grid-column: 1 / -1;
      }

      .lookup-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      .lookup-row .field {
        flex: 1;
      }

      .lookup-result {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fbfcfe;
      }

      .lookup-result strong {
        display: block;
        font-size: 13.5px;
      }

      .lookup-result span {
        color: var(--muted);
        font-size: 12px;
      }

      .warranty-box {
        padding: 12px 13px;
        border-radius: 11px;
        border: 1px solid #b8e6cc;
        background: #f6fef9;
      }

      .warranty-box.off {
        border-color: #f3b6b1;
        background: #fff8f7;
      }

      .warranty-box.unknown {
        border-color: #f5d38b;
        background: #fffcf3;
      }

      .warranty-box h4 {
        margin: 0 0 4px;
        font-size: 13.5px;
      }

      .warranty-box p {
        margin: 0;
        color: #475467;
        font-size: 12.5px;
      }

      .check-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .check-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        font-size: 12.5px;
      }

      .check-item input {
        accent-color: var(--primary);
      }

      .priority-preview {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f8faff;
        border: 1px solid #dbe6ff;
        font-size: 12.5px;
      }

      .priority-preview strong {
        color: var(--primary);
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 4px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
        gap: 18px;
        align-items: start;
      }

      .detail-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .detail-hero {
        padding: 20px;
        background: linear-gradient(115deg, #12306f, #1d4ed8 55%, #0e7490);
        color: #fff;
      }

      .detail-hero-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .detail-code {
        margin: 0;
        font-size: clamp(22px, 3vw, 31px);
        letter-spacing: -0.7px;
      }

      .detail-hero p {
        margin: 5px 0 0;
        color: #dbe7ff;
        font-size: 13px;
      }

      .hero-pills {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .hero-pills .pill {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .detail-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 18px;
      }

      .info-item {
        min-width: 0;
      }

      .info-label {
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .info-value {
        margin-top: 2px;
        font-size: 13.5px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .divider {
        height: 1px;
        background: var(--line);
      }

      .issue-box {
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fbfcfe;
        font-size: 13.5px;
        white-space: pre-wrap;
      }

      .timeline {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-top: 6px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 10px;
        position: relative;
        padding-bottom: 16px;
      }

      .timeline-item:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 18px;
        bottom: 0;
        width: 2px;
        background: #e4e9f2;
      }

      .timeline-dot {
        width: 18px;
        height: 18px;
        margin-top: 1px;
        border-radius: 50%;
        border: 4px solid #dbe6ff;
        background: var(--primary);
        z-index: 1;
      }

      .timeline-body {
        min-width: 0;
      }

      .timeline-top {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      .timeline-note {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      .timeline-meta {
        margin-top: 3px;
        color: #98a2b3;
        font-size: 11.5px;
      }

      .next-status-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfcfe;
      }

      .next-status-box h4 {
        margin: 0;
        font-size: 13px;
      }

      .next-status-box p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-card {
        width: min(940px, 100%);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 26px 80px rgba(18, 48, 111, 0.18);
      }

      .login-hero {
        padding: 42px 38px;
        background:
          radial-gradient(circle at 100% 0%, rgba(14, 116, 144, 0.62), transparent 19rem),
          linear-gradient(140deg, #102a63, #1d4ed8);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
        min-height: 540px;
      }

      .login-hero h1 {
        margin: 20px 0 8px;
        font-size: clamp(28px, 3.6vw, 40px);
        line-height: 1.08;
        letter-spacing: -1.2px;
      }

      .login-hero p {
        margin: 0;
        color: #dbe7ff;
        font-size: 14px;
        max-width: 34ch;
      }

      .login-points {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }

      .login-point {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        color: #eaf1ff;
        font-size: 13px;
      }

      .login-point i {
        display: grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.16);
        font-style: normal;
        font-size: 11px;
        flex: none;
      }

      .login-form {
        padding: 38px 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      .login-form h2 {
        margin: 0;
        font-size: 23px;
        letter-spacing: -0.5px;
      }

      .login-form p {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .demo-accounts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .demo-account {
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fbfcfe;
        padding: 10px 11px;
      }

      .demo-account:hover {
        border-color: #b8c7e8;
        background: #f6f9ff;
      }

      .demo-account b {
        display: block;
        font-size: 12.5px;
      }

      .demo-account span {
        color: var(--muted);
        font-size: 11.5px;
      }

      .page-footer {
        color: #98a2b3;
        font-size: 11.5px;
        text-align: center;
        padding-top: 8px;
      }

      .back-link {
        border: 0;
        background: transparent;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        padding: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .loading-line {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12.5px;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #c7d7fe;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1080px) {
        .metrics-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .filters {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .intake-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .app-shell {
          padding: 14px 12px 40px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .user-area {
          justify-content: flex-start;
        }

        .metrics-grid,
        .filters,
        .form-grid,
        .info-grid,
        .error-sections {
          grid-template-columns: 1fr;
        }

        .login-card {
          grid-template-columns: 1fr;
        }

        .login-hero {
          min-height: auto;
          padding: 28px 24px;
        }

        .login-form {
          padding: 26px 22px;
        }

        .detail-hero-top {
          flex-direction: column;
        }

        .hero-pills {
          justify-content: flex-start;
        }

        .lookup-row {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
